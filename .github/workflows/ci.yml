name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile *.py

      - name: Runtime self-checks
        run: python test_runtime.py

      - name: Tools self-checks
        # Skips itself (exit 0) when no Maestro checkout is reachable --
        # CI has no private monorepo; the local run inside a tree is the real one.
        run: python test_tools.py

  # Runs for both a plain push to main (auto: bump the patch version) and a
  # hand-pushed v* tag (manual: cut whatever version was asked for). One job,
  # one run -- a tag pushed here with GITHUB_TOKEN would NOT retrigger this
  # workflow (GitHub suppresses that on purpose, to stop infinite loops), so
  # tagging and releasing happen together instead of across two runs.
  release:
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            git fetch --tags
            last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            if [ -z "$last" ]; then
              next="v0.1.0"
            else
              ver=${last#v}
              IFS=. read -r major minor patch <<< "$ver"
              next="v$major.$minor.$((patch + 1))"
            fi
            git tag "$next"
            git push origin "$next"
            echo "tag=$next" >> "$GITHUB_OUTPUT"
          fi

      - name: Build source archive
        run: |
          git archive --format=tar.gz \
            --prefix="pdm_ai_server-${{ steps.ver.outputs.tag }}/" \
            -o "pdm_ai_server-${{ steps.ver.outputs.tag }}.tar.gz" HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build standalone executable
        # No data files to bundle -- the corpus and every cache dir
        # (models, index, runtime) live outside the repo, resolved from
        # AGENT_MAESTRO_ROOT / AGENT_*_DIR at runtime, same as the source
        # install. --collect-all is the standard fix for uvicorn/fastapi's
        # dynamic imports (protocol/loop backends) that PyInstaller's static
        # analysis alone would miss.
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --name pdm-ai-server \
            --collect-all uvicorn --collect-all fastapi --collect-all httpx \
            main.py
          mv dist/pdm-ai-server "pdm-ai-server-linux-x86_64-${{ steps.ver.outputs.tag }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            pdm_ai_server-*.tar.gz
            pdm-ai-server-linux-x86_64-*
          body: |
            Source release of the PdM AI Agent server, plus a standalone
            Linux x86_64 executable that needs no Python install.

            ```bash
            tar xzf pdm_ai_server-*.tar.gz && cd pdm_ai_server-*
            python3 setup.py   # interactive wizard: venv, config, optional llama-server build
            ```

            Or skip Python entirely with the executable, once `AGENT_MAESTRO_ROOT`
            points at a real PdM Maestro checkout:

            ```bash
            chmod +x pdm-ai-server-linux-x86_64-*
            AGENT_MAESTRO_ROOT=/path/to/PdM-Maestro_gui ./pdm-ai-server-linux-x86_64-*
            ```
          generate_release_notes: true
